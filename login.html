<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer login | Ramakkalmedu</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"></head><body>
<header class="portal-header"><a class="brand" href="index.html"><span class="brand-mark"><i></i><i></i><i></i></span><span>RAMAKKALMEDU<small>KERALA, INDIA</small></span></a><nav class="portal-nav"><a class="home-label" href="index.html">Back to explore</a><a class="nav-button" href="register.html">Create account</a></nav></header>
<main class="auth-shell"><section class="auth-visual"><p class="eyebrow">WELCOME BACK</p><h1>The hills are<br /><em>calling again.</em></h1><p>Log in to plan your stay, reserve an off-road adventure, and see your bookings.</p></section><section class="auth-panel"><div class="form-wrap"><p class="eyebrow">CUSTOMER LOGIN</p><h2>Good to see you</h2><p class="subcopy">Enter your details to continue to booking.</p><div id="form-message" class="message" role="alert"></div><form id="login-form"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><div class="password-line"><label for="password">Password</label><button type="button" data-password-toggle="password">Show</button></div><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required></div><label class="check-line"><input type="checkbox"><span>Keep me signed in on this device</span></label><button class="primary-button" type="submit">Log in &amp; continue <span>&rarr;</span></button></form><p class="switch-copy">New to Ramakkalmedu? <a href="register.html">Create an account</a></p></div></section></main><script src="account.js"></script></body></html>
